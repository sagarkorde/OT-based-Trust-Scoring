# E4 laptop profile. Mandatory experiment (never dropped); GCG scaled to the 8 GB GPU.
seeds: [0, 1, 2]
encoder: {kind: hf_tokens, model: BAAI/bge-base-en-v1.5, device: cuda}
dilution: {factors: [0.25, 0.5, 1, 2, 4, 8], max_items: 1500}
paraphrase:
  llm: {model: ots-llama3.1-8b-4k, ollama_base: "llama3.1:8b", num_ctx: 4096, base_url: "http://localhost:11434/v1", max_tokens: 512}
  n_prompts: 500
  rag_datasets: [nq, hotpotqa, msmarco]
gcg:
  model: meta-llama/Llama-3.1-8B-Instruct   # 4-bit NF4
  layer: 16
  lambdas: [0.0, 1.0]
  n_behaviors: 15
  n_seeds: 1
  suffix_len: 20
  steps: 150
  topk: 128
  batch: 32
  early_stop_ce: 0.05
  judge: cais/HarmBench-Llama-2-13b-cls      # bf16 on CPU
e2_attacks: [poisonedrag_blackbox, poisonedrag_dilute_1x, poisonedrag_dilute_2x, poisonedrag_dilute_4x, poisonedrag_paraphrase]
agentdojo_attacks: [important_instructions, direct]
