# Phase 2 reproduction gates on the laptop profile (RTX 4060 8 GB, Ollama Q4 models).
# Quantization (Ollama Q4_K_M / Q4_0 instead of fp16) is a known source of gap: record it next to each number.
G1:   # PoisonedRAG reports LLaMA-2-7B among its LLMs -> comparable model
  dataset: nq
  retriever: contriever
  top_k: 5
  adv_per_query: 5
  n_targets: 100
  llm: {model: ots-llama2-7b-4k, ollama_base: "llama2:7b-chat", num_ctx: 4096, base_url: "http://localhost:11434/v1", max_tokens: 150}
G2:   # AgentDojo results table (docs/results-table.html, pinned commit 089ed468): openai gpt-4o-mini-2024-07-18,
  # defense None, important_instructions, 2024-07-19 -> utility 68.04 %, utility under attack 49.92 %, targeted ASR
  # 27.19 %. That row predates benchmark v1.1, so it was run on v1: reproduce on v1. No 8 GB-sized local model is on
  # the table, hence the API model (authors' decision 2026-11-16). Needs OPENAI_API_KEY; uses no local GPU.
  benchmark_version: v1
  suites: [workspace, travel, banking, slack]
  attack: important_instructions
  llm: {provider: openai, model: gpt-4o-mini-2024-07-18}
G3:   # InjecAgent Table 3 reports prompted Mistral-7B (base setting) -> comparable model
  setting: base
  llm: {model: ots-mistral-7b-v02-8k, ollama_base: "mistral:7b-instruct-v0.2-q4_K_M", num_ctx: 8192, base_url: "http://localhost:11434/v1", max_tokens: 512}
G3_v01:   # sensitivity check for G3: InjecAgent does not name its Mistral-7B release; same run with Instruct v0.1.
  # Same 4-bit level as G3 (Q4_K_M GGUF of the official weights); chat template and stop words copied from the v0.2
  # Ollama model, because this GGUF carries none (v0.1 and v0.2 share the [INST] ... [/INST] format)
  setting: base
  llm: {model: ots-mistral-7b-v01-8k, ollama_base: "hf.co/TheBloke/Mistral-7B-Instruct-v0.1-GGUF:Q4_K_M",
        template_from: "mistral:7b-instruct-v0.2-q4_K_M", num_ctx: 8192, base_url: "http://localhost:11434/v1", max_tokens: 512}
  # attacker-response simulator for DS cache misses = the G3 run's model, so only the agent model differs
  sim_llm: {model: ots-mistral-7b-v02-8k, ollama_base: "mistral:7b-instruct-v0.2-q4_K_M", num_ctx: 8192, base_url: "http://localhost:11434/v1", max_tokens: 512}
G4:   # HarmBench reports Mistral 7B (Instruct v0.2) with DirectRequest -> comparable model
  llm: {model: ots-mistral-7b-v02-4k, ollama_base: "mistral:7b-instruct-v0.2-q4_K_M", num_ctx: 4096, base_url: "http://localhost:11434/v1", max_tokens: 512}
  max_new_tokens: 512
  judge: cais/HarmBench-Llama-2-13b-cls      # bf16 on CPU (OT_JUDGE_DEVICE=cpu), ~26 GB RAM
