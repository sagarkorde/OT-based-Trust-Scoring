# E3 laptop profile: one open LLM (Llama 3.1 8B, Ollama Q4, 16k context), 3 seeds, one attack in E3
# ('direct' minimal injection runs in E4). The WTS encoder (BGE, ~0.5 GB) runs on the GPU next to the LLM
# (authors' request 2026-11-20; it ran on the CPU until then: InjecAgent and the ground-truth detection).
seeds: [0, 1, 2]
alpha: 0.05
encoder: {kind: hf_tokens, model: BAAI/bge-base-en-v1.5, device: cuda}
agentdojo:
  replay: true          # authors' decision 2026-11-19: see scripts/run_e3_agentdojo.py docstring
  replay_check_n: 30
  pi_detector_device: cpu   # AgentDojo's DeBERTa detector on long tool outputs overflows 8 GB VRAM (see run_e3_agentdojo._from_config_pi_device)
  benchmark_version: v1.2.2
  suites: [workspace, travel, banking, slack]
  attacks: [important_instructions]
  calibration_task_frac: 0.5
  defenses: [none, spotlighting_with_delimiting, transformers_pi_detector, wts_output_block, wts_drift_confirm, wts_full]
  llms:   # num_predict: reply cap (2026-11-21); without it a degenerate reply ran until the 30-min client timeout
    - {model: ots-llama3.1-8b-16k, ollama_base: "llama3.1:8b", num_ctx: 16384, num_predict: 4096,
       base_url: "http://localhost:11434/v1"}
injecagent:
  splits: [dh, ds]
  settings: [base, enhanced]
  benign_filler_source: alpaca
  llms:
    - {model: ots-llama3.1-8b-16k, ollama_base: "llama3.1:8b", num_ctx: 16384, base_url: "http://localhost:11434/v1", max_tokens: 512}
  defenses: [none, wts_output_block]
  replay: true          # authors' decision 2026-11-19: see scripts/run_e3_injecagent.py docstring
  replay_check_n: 30
