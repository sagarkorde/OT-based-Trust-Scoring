# E2: RAG knowledge poisoning and jamming (RQ2)
seeds: [0, 1, 2, 3, 4]
alpha: 0.05
datasets: [nq, hotpotqa, msmarco]
retrievers: [contriever]          # PoisonedRAG ships top-100 for contriever; add contriever-msmarco and ance
                                  # after running ext/PoisonedRAG/evaluate_beir.py for them (plan Section 5.3)
top_k: 5                          # contexts given to the LLM
pool_k: 20                        # k' for the leave-one-out reference (pre-registered)
lambda: 0.5                       # corpus mixing weight (pre-registered); sweep in exploratory run only
adv_per_query: 5
n_calibration_queries: 200        # non-target queries; their clean top-k chunks calibrate tau
n_corpus_reference: 5000          # random clean passages for the corpus reference
encoder: {kind: hf_tokens, model: BAAI/bge-base-en-v1.5}

llms:
  - {model: meta-llama/Llama-3.1-8B-Instruct, base_url: "http://localhost:8000/v1", max_tokens: 64}
  - {model: Qwen/Qwen2.5-7B-Instruct, base_url: "http://localhost:8001/v1", max_tokens: 64}
  - {model: mistralai/Mistral-7B-Instruct-v0.3, base_url: "http://localhost:8002/v1", max_tokens: 64}
  # - {model: gpt-4o-mini, base_url: null, max_tokens: 64}

attacks: [poisonedrag_blackbox, jamming_explicit]
# poisonedrag_whitebox (HotFlip): generate with ext/PoisonedRAG/run.py --attack_method hotflip, then point here:
whitebox_adv_dir: null
# jamming optimized blockers (Shafran et al.): generate with the authors' code and point to a JSON {query_id: [text]}
jamming_optimized_path: null

defenses: [none, wts, perplexity, paraphrase_rerank, robustrag_keyword]
robustrag: {alpha: 0.3, beta: 3.0}
